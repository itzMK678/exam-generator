services:
  # 1. High-Performance Python Document Extractor
  - type: web
    name: examforge-worker
    runtime: python
    rootDir: python-worker
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn App:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # 2. Main Express API Backend
  - type: web
    name: examforge-api
    runtime: node
    rootDir: server
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.14.0
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PYTHON_WORKER_URL
        fromService:
          type: web
          name: examforge-worker
          property: host
      - key: CORS_ORIGIN
        value: "*"
